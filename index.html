<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA VI – Free Download (Full Game)</title>
<meta name="description" content="GTA VI free download. Full game, no survey, no password.">
<style>
  :root{--pink:#ff2e93;--orange:#ff9d2e;--cyan:#28e1ff;--dark:#0b0414}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--dark);color:#fff;overflow-x:hidden}
  body.shake{animation:shake .5s linear infinite}
  @keyframes shake{
    0%{transform:translate(0,0)}20%{transform:translate(-8px,6px)}40%{transform:translate(7px,-7px)}
    60%{transform:translate(-6px,-5px)}80%{transform:translate(8px,5px)}100%{transform:translate(0,0)}}

  /* ---------- Stage 1: fake download page ---------- */
  #landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:24px 16px;position:relative;
    background:
      radial-gradient(circle at 50% 38%,#ff9d2e 0,#ff2e93 28%,#5a1a8a 55%,#0b0414 80%);}
  #landing::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;
    background:
      linear-gradient(transparent 0,rgba(11,4,20,.9) 100%),
      repeating-linear-gradient(90deg,rgba(40,225,255,.35) 0 2px,transparent 2px 60px),
      repeating-linear-gradient(0deg,rgba(40,225,255,.35) 0 2px,transparent 2px 40px);
    transform:perspective(300px) rotateX(55deg);transform-origin:bottom;pointer-events:none}
  .badge{display:inline-block;background:#12e07a;color:#04210f;font-weight:800;letter-spacing:.08em;font-size:.8rem;
    padding:6px 14px;border-radius:999px;margin-bottom:18px;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  h1{font-size:clamp(4rem,18vw,10rem);font-weight:900;letter-spacing:.02em;line-height:1;
    background:linear-gradient(180deg,#fff 10%,#ffd1ec 50%,var(--cyan) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(255,46,147,.8))}
  .sub{margin:14px 0 6px;font-size:clamp(1rem,3.4vw,1.5rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .meta{opacity:.85;font-size:.95rem;margin-bottom:26px}
  .platforms{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px;position:relative;z-index:2}
  .platforms span{border:1px solid rgba(255,255,255,.4);padding:5px 12px;border-radius:6px;font-size:.8rem;background:rgba(0,0,0,.3)}
  #dlBtn{position:relative;z-index:2;cursor:pointer;border:0;font-size:clamp(1.1rem,4vw,1.5rem);font-weight:900;color:#fff;
    padding:20px 44px;border-radius:14px;letter-spacing:.04em;
    background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 0 0 0 rgba(255,46,147,.7),0 12px 40px rgba(255,46,147,.5);
    animation:glow 1.6s infinite;transition:transform .15s}
  #dlBtn:hover{transform:scale(1.06)}
  #dlBtn:active{transform:scale(.97)}
  @keyframes glow{70%{box-shadow:0 0 0 24px rgba(255,46,147,0),0 12px 40px rgba(255,46,147,.5)}100%{box-shadow:0 0 0 0 rgba(255,46,147,0),0 12px 40px rgba(255,46,147,.5)}}
  .live{position:relative;z-index:2;margin-top:22px;font-size:.85rem;opacity:.9}
  .live b{color:#12e07a}

  /* ---------- Stage 2: fake loader ---------- */
  #loader{position:fixed;inset:0;background:rgba(5,2,12,.96);display:none;flex-direction:column;align-items:center;justify-content:center;
    z-index:20;padding:24px;text-align:center}
  #loader.on{display:flex}
  #loader h2{font-size:clamp(1.2rem,4vw,1.8rem);margin-bottom:22px}
  .bar{width:min(520px,90vw);height:22px;border-radius:12px;background:#2a1b3d;overflow:hidden;border:1px solid #5b3a85}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .25s linear}
  #pct{margin-top:14px;font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums}
  #step{margin-top:6px;opacity:.75;font-size:.95rem;min-height:1.4em}

  /* ---------- Stage 3: the reveal ---------- */
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
  #flash.go{animation:flash .9s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}

  #reveal{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;background:radial-gradient(circle,#2b0a4a 0,#0b0414 70%);padding:16px;text-align:center}
  #reveal.on{display:flex}
  .rays{position:absolute;width:250vmax;height:250vmax;left:50%;top:50%;margin:-125vmax 0 0 -125vmax;
    background:repeating-conic-gradient(from 0deg,rgba(255,46,147,.28) 0 8deg,transparent 8deg 20deg);
    animation:spin 14s linear infinite;pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .glitch{position:relative;z-index:3;font-size:clamp(2.2rem,9vw,5rem);font-weight:900;letter-spacing:.03em;margin-bottom:16px;
    background:linear-gradient(90deg,#fff,#ffe26b,#ff6bd5,#6bf0ff,#fff);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 3s linear infinite,textpop .8s cubic-bezier(.2,1.6,.4,1) both;text-shadow:none;
    filter:drop-shadow(0 0 14px rgba(255,255,255,.5))}
  @keyframes shine{to{background-position:300% 0}}
  @keyframes textpop{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}

  .frame{position:relative;z-index:3;width:min(78vw,52vh * .75 + 40px,420px);padding:10px;border-radius:22px;
    background:linear-gradient(135deg,var(--pink),var(--orange),var(--cyan),var(--pink));background-size:300% 300%;
    animation:borderflow 4s linear infinite,popin 1s cubic-bezier(.2,1.5,.35,1) .15s both,float 3.4s ease-in-out 1.2s infinite;
    box-shadow:0 0 60px rgba(255,46,147,.7),0 0 140px rgba(40,225,255,.4)}
  @keyframes borderflow{to{background-position:300% 300%}}
  @keyframes popin{0%{transform:scale(0) rotate(-200deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
  .frame img{display:block;width:100%;max-height:52vh;object-fit:cover;border-radius:14px;animation:huepulse 5s linear infinite}
  @keyframes huepulse{0%,100%{filter:saturate(1.1) contrast(1.05)}50%{filter:saturate(1.5) contrast(1.15) hue-rotate(12deg)}}
  .frame::after{content:"";position:absolute;inset:10px;border-radius:14px;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;
    animation:sweep 2.6s ease-in-out infinite}
  @keyframes sweep{0%{background-position:150% 0}100%{background-position:-50% 0}}

  .caption{position:relative;z-index:3;margin-top:20px;font-size:clamp(1rem,3.6vw,1.4rem);font-weight:700;
    animation:fadeup .8s ease 1.1s both}
  .caption small{display:block;margin-top:6px;opacity:.75;font-weight:500;font-size:.85em}
  @keyframes fadeup{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
  #again{position:relative;z-index:3;margin-top:18px;cursor:pointer;border:2px solid #fff;background:transparent;color:#fff;
    padding:10px 22px;border-radius:10px;font-weight:700;font-size:1rem;animation:fadeup .8s ease 1.6s both}
  #again:hover{background:#fff;color:#2b0a4a}

  canvas#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
  .emoji{position:fixed;top:-50px;z-index:35;font-size:2rem;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

  /* screen glitch while loader hits 99% */
  body.glitching #loader{animation:glitch .25s steps(2) infinite}
  @keyframes glitch{
    0%{transform:translate(0);filter:hue-rotate(0)}
    25%{transform:translate(-6px,3px);filter:hue-rotate(90deg) saturate(3)}
    50%{transform:translate(5px,-4px);filter:invert(1)}
    75%{transform:translate(-3px,-2px);filter:hue-rotate(200deg)}
    100%{transform:translate(0);filter:none}}

  @media (prefers-reduced-motion:reduce){
    .rays,.frame,.glitch,#dlBtn,.badge{animation-duration:0s;animation-iteration-count:1}
    body.shake{animation:none}
  }
</style>
</head>
<body>

<!-- Stage 1 -->
<main id="landing">
  <span class="badge">● 100% WORKING · NO SURVEY</span>
  <h1>GTA VI</h1>
  <p class="sub">Free Download — Full Game</p>
  <p class="meta">Version 1.0.3 · 74.2 GB · Early access build</p>
  <div class="platforms"><span>PC</span><span>PS5</span><span>Xbox Series X|S</span></div>
  <button id="dlBtn" type="button">⬇ DOWNLOAD NOW — FREE</button>
  <p class="live"><b id="count">12,847</b> people downloading right now</p>
</main>

<!-- Stage 2 -->
<section id="loader" aria-live="polite">
  <h2>Preparing your download…</h2>
  <div class="bar"><i id="fill"></i></div>
  <div id="pct">0%</div>
  <div id="step">Connecting to server…</div>
</section>

<!-- Stage 3 -->
<div id="flash"></div>
<section id="reveal">
  <div class="rays"></div>
  <div class="glitch">PARI 😂</div>
  <div class="frame"><img src="photo.webp" alt="The prank reveal"></div>
  <p class="caption">There is no free GTA 6 here. Only this legend.<small>Sorry to disappoint you 🙏</small></p>
  <button id="again" type="button">Try again</button>
</section>
<canvas id="confetti"></canvas>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var btn=$('dlBtn'), loader=$('loader'), fill=$('fill'), pct=$('pct'), step=$('step'),
      reveal=$('reveal'), flash=$('flash'), cv=$('confetti'), ctx=cv.getContext('2d');

  // fake live counter
  var n=12847;
  setInterval(function(){ n+=Math.floor(Math.random()*9)-2; $('count').textContent=n.toLocaleString(); },900);

  var steps=[[0,'Connecting to server…'],[18,'Verifying you are human…'],[40,'Unlocking premium files…'],
             [65,'Bypassing the paywall…'],[85,'Almost there…'],[97,'Finalizing…']];

  btn.addEventListener('click', start);

  function start(){
    loader.classList.add('on');
    var p=0;
    var t=setInterval(function(){
      // slows down near the end for suspense
      p += p<80 ? Math.random()*5+1.5 : Math.random()*1.1+.2;
      if(p>=99){p=99;clearInterval(t);hold();}
      fill.style.width=p+'%'; pct.textContent=Math.floor(p)+'%';
      for(var i=steps.length-1;i>=0;i--){ if(p>=steps[i][0]){step.textContent=steps[i][1];break;} }
    },120);
  }

  function hold(){
    step.textContent='Download ready…';
    setTimeout(function(){
      document.body.classList.add('glitching','shake');
      step.textContent='ERROR… ERROR… 💀';
      beep(120,.25,'sawtooth');
      setTimeout(boom,1100);
    },900);
  }

  function boom(){
    document.body.classList.remove('glitching');
    flash.classList.add('go');
    loader.classList.remove('on');
    document.getElementById('landing').style.display='none';
    reveal.classList.add('on');
    horn();
    setTimeout(function(){document.body.classList.remove('shake')},600);
    burst(); setTimeout(burst,700); setTimeout(burst,1500);
    emojiRain();
  }

  /* ---------- sound (WebAudio, only after a click) ---------- */
  var ac;
  function audio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return ac; }
  function beep(freq,dur,type){
    var a=audio(); if(!a) return;
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(.12,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }
  function horn(){
    [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){beep(f,.28,'triangle')}, i*110); });
    setTimeout(function(){beep(1318,.7,'square')},480);
  }

  /* ---------- confetti ---------- */
  var pieces=[], raf;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  addEventListener('resize',size); size();
  var colors=['#ff2e93','#ff9d2e','#28e1ff','#ffe26b','#ffffff','#12e07a'];
  function burst(){
    for(var i=0;i<140;i++){
      var side=Math.random()<.5;
      pieces.push({x:side?0:cv.width,y:cv.height*.75,
        vx:(side?1:-1)*(Math.random()*9+3), vy:-(Math.random()*16+8),
        w:Math.random()*9+5,h:Math.random()*5+3,r:Math.random()*6,vr:Math.random()*.4-.2,
        c:colors[Math.floor(Math.random()*colors.length)],life:0});
    }
    if(!raf) loop();
  }
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pieces=pieces.filter(function(p){return p.y<cv.height+30 && p.life<420});
    pieces.forEach(function(p){
      p.vy+=.35; p.vx*=.992; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    raf = pieces.length ? requestAnimationFrame(loop) : null;
  }

  /* ---------- emoji rain ---------- */
  function emojiRain(){
    var list=['😂','🤣','💀','🎮','🔥','😭','🤡'];
    for(var i=0;i<34;i++){
      (function(i){ setTimeout(function(){
        var e=document.createElement('div'); e.className='emoji';
        e.textContent=list[Math.floor(Math.random()*list.length)];
        e.style.left=Math.random()*100+'vw';
        e.style.fontSize=(Math.random()*1.8+1.2)+'rem';
        e.style.animationDuration=(Math.random()*2.5+2.5)+'s';
        document.body.appendChild(e);
        setTimeout(function(){e.remove()},6000);
      }, i*160); })(i);
    }
  }

  $('again').addEventListener('click',function(){location.reload()});
})();
</script>
</body>
</html>
